services:
  - type: web
    name: mini-erp-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run prisma:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: supersecret_jwt_key_erp_crm_2026
      - key: DATABASE_URL
        value: "file:./dev.db"
